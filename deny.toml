[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "NCSA",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]
private = { ignore = true }

[[licenses.clarify]]
name = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[advisories]
# Retain async-std and its pin-utils dependency for runtime-async-std compatibility.
ignore = [
    "RUSTSEC-2025-0052", # async-std is unmaintained
    "RUSTSEC-2026-0441", # pin-utils is unmaintained
]
